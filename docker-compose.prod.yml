# Имя проекта Compose жёстко зафиксировано, чтобы запуск без `-p` не путал
# prod и dev-стек. См. комментарий в docker-compose.dev.yml.
name: sewing-prod

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    networks:
      - prod-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    # Host-порт 8081 убран: после ввода reverse proxy api ходит ТОЛЬКО через
    # nginx на /api/ и /uploads/ (см. nginx/conf.d/10-prod-teeon-ru.conf).
    # Если на время отладки нужно достучаться напрямую — добавьте обратно
    # `ports: - "127.0.0.1:8081:3001"` (только loopback).
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://user:${DB_PASSWORD}@db:5432/myapp
      # Мультитенантность (DB-per-tenant): БД реестра тенантов. Пусто ⇒
      # single-tenant fallback (control-plane выключен) — текущее поведение.
      # Включение: задать CONTROL_PLANE_DATABASE_URL в .env.prod.
      CONTROL_PLANE_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL:-}
      # Публичные URL — используются для CORS-whitelist, формирования
      # абсолютных ссылок и Domain в session-cookie. Дефолты прибиты к
      # prod.teeon.ru, поэтому даже без .env.prod конфиг будет валидный.
      APP_URL: ${APP_URL:-https://prod.teeon.ru}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://prod.teeon.ru}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://prod.teeon.ru/api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://prod.teeon.ru}
      # Корень дискового хранилища для модулей «Лекала» и «Категории
      # номенклатуры» (см. apps/api/src/main.ts → useStaticAssets и
      # apps/api/src/modules/patterns/patterns-storage.service.ts).
      # Указываем абсолютный путь, который монтируется из named volume
      # ниже — иначе fallback пишет внутрь /app/apps/api/uploads и всё
      # пропадает при пересборке api-образа.
      PATTERNS_UPLOADS_DIR: /var/lib/sewing/uploads
      # Авто-синхронизация схемы Prisma при старте контейнера.
      # Чтобы выключить — поставьте PRISMA_AUTO_SYNC=0 в .env.prod.
      PRISMA_AUTO_SYNC: ${PRISMA_AUTO_SYNC:-1}
      PRISMA_AUTO_SYNC_RETRIES: ${PRISMA_AUTO_SYNC_RETRIES:-15}
      PRISMA_AUTO_SYNC_ACCEPT_DATA_LOSS: ${PRISMA_AUTO_SYNC_ACCEPT_DATA_LOSS:-0}
      # Web Push (VAPID) — фоновые уведомления о браке швеям. Задаются
      # в .env.prod (gitignored). Без них push-модуль стартует в
      # disabled-режиме: подписки сохраняются, отправка пропускается
      # (см. apps/api/src/modules/push/push.service.ts). VAPID_SUBJECT
      # по умолчанию = APP_URL.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      # Загруженные пользователем файлы (превью лекал, DXF по размерам,
      # иконки категорий). Persistent named volume — переживает любые
      # `docker compose up -d --build api` и `docker compose down`.
      # Тот же путь раздаёт nginx через прокси /uploads/ (см.
      # nginx/conf.d/10-prod-teeon-ru.conf и Express-mount в main.ts).
      - prod_uploads:/var/lib/sewing/uploads
    depends_on:
      - db
    restart: always
    networks:
      - prod-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        # ВАЖНО: NEXT_PUBLIC_API_URL вшивается в client-bundle во время билда
        # и попадает в браузер as-is. На prod это публичный URL за nginx.
        # Если переопределяете в .env.prod — указывайте ТОЛЬКО https://prod.teeon.ru/api
        # (либо `/api` для same-origin), иначе client уйдёт мимо nginx.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://prod.teeon.ru/api}
        # Фиче-флаги admin-модулей — тоже build-time (вшиваются в bundle).
        # Дефолт `1` (включено): без явной передачи модули «Поставщики» /
        # «Заказы поставщикам» и выбор поставщика из справочника на
        # потребности могли не появляться в проде. См. feature-flags.ts.
        NEXT_PUBLIC_FEATURE_PATTERNS: ${NEXT_PUBLIC_FEATURE_PATTERNS:-1}
        NEXT_PUBLIC_FEATURE_WORKSHOP_NEEDS: ${NEXT_PUBLIC_FEATURE_WORKSHOP_NEEDS:-1}
        NEXT_PUBLIC_FEATURE_SUPPLIERS: ${NEXT_PUBLIC_FEATURE_SUPPLIERS:-1}
        NEXT_PUBLIC_FEATURE_PURCHASE_ORDERS: ${NEXT_PUBLIC_FEATURE_PURCHASE_ORDERS:-1}
        NEXT_PUBLIC_FEATURE_PURCHASE_RECEIPTS: ${NEXT_PUBLIC_FEATURE_PURCHASE_RECEIPTS:-1}
    # Прямой проброс host:80 убран: порт 80 теперь занят nginx-сервисом
    # (TLS-терминатор для https://prod.teeon.ru, ACME-challenge для
    # Let's Encrypt). web доступен только в docker-сети по имени `web:3000`.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # Тот же URL пробрасываем в runtime — нужен для server-side fetch
      # внутри RSC, если кто-то вместо INTERNAL_API_URL прочитает этот.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://prod.teeon.ru/api}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://prod.teeon.ru}
      APP_URL: ${APP_URL:-https://prod.teeon.ru}
      INTERNAL_API_URL: http://api:3001/api
      API_URL: http://api:3001/api
      # Стабильный ключ шифрования для Next.js Server Actions: без него
      # ключ генерируется при каждом старте контейнера, и сабмиты форм
      # с уже открытых клиентских страниц молча отбрасываются после
      # рестарта web (Next 14+ рефлексирует action ID и бракует «чужие»).
      # Подробности и генерация ключа — см. .env.prod.
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    depends_on:
      - api
    restart: always
    networks:
      - prod-network

  nginx:
    # Reverse-proxy / TLS-терминатор для prod.teeon.ru.
    # Стабильный alpine-образ, ничего не собираем — только конфиги.
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Главный конфиг и vhost-ы — read-only, чтобы случайно не затёрли изнутри.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Сертификаты Let's Encrypt — read-only. /etc/letsencrypt содержит
      # symlink-и в /etc/letsencrypt/archive — монтируем корень целиком,
      # иначе ssl_certificate увидит «битую» цепочку.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot для ACME http-01 challenge. Сюда certbot --webroot пишет
      # токены, отсюда же 00-shared.conf их раздаёт.
      - /var/www/certbot:/var/www/certbot:ro
      # Логи наружу — удобно tail-ить с хоста и логротейтить системным
      # logrotate (см. /etc/logrotate.d/sewing-letsencrypt и при желании
      # отдельный конфиг для nginx).
      - /var/log/nginx-sewing:/var/log/nginx
    depends_on:
      - web
      - api
    networks:
      - prod-network
      # Подключаемся также к сети dev-стека (`docker-compose.dev.yml`,
      # project=sewing → имя сети `sewing_app-network`). Это позволяет
      # одному nginx-у обслуживать оба домена: prod.teeon.ru → prod-стек,
      # dev.teeon.ru → dev-стек. external=true означает «не создаём сеть,
      # подключаемся к уже существующей»; nginx стартует только если
      # dev-стек хотя бы раз поднимался и сеть была создана. Если dev
      # никогда не запускался — сначала `docker compose --env-file .env.dev
      # -f docker-compose.dev.yml up -d` (создаст сеть), потом prod-стек.
      - dev-network
    healthcheck:
      # Лёгкий self-check — конфиг валиден.
      test: ["CMD", "nginx", "-t", "-q"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # Том prod-БД. external=true → Compose не создаёт и не удаляет его сам
  # (защита от случайного `down -v`). Для нового сервера выполнить заранее:
  #   docker volume create sewing-prod_prod_db_data
  prod_db_data:
    external: true
    name: sewing-prod_prod_db_data
  # Том prod-uploads (превью лекал, DXF, иконки категорий). external=true
  # по тем же причинам, что и prod_db_data — `down -v` не должен сносить
  # пользовательский контент. На новом сервере выполнить заранее:
  #   docker volume create sewing-prod_uploads
  prod_uploads:
    external: true
    name: sewing-prod_uploads

networks:
  prod-network:
    driver: bridge
  # Сеть dev-стека (`docker-compose.dev.yml`, project=sewing). external=true
  # → не создаём её здесь, только подключаем nginx к уже существующей.
  # Если поднимаете prod на новом сервере БЕЗ dev — закомментируйте обе
  # строки `- dev-network` (в nginx.networks и здесь), иначе compose
  # упадёт с «network sewing_app-network not found».
  dev-network:
    external: true
    name: sewing_app-network
