services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    networks:
      - prod-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    ports:
      - "8081:3001"
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://user:${DB_PASSWORD}@db:5432/myapp
      APP_URL: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
    depends_on:
      - db
    restart: always
    networks:
      - prod-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081/api}
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081/api}
      INTERNAL_API_URL: http://api:3001/api
      API_URL: http://api:3001/api
    depends_on:
      - api
    restart: always
    networks:
      - prod-network

volumes:
  prod_db_data:

networks:
  prod-network:
    driver: bridge
