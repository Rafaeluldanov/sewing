# Имя проекта Compose жёстко зафиксировано, чтобы запуск без `-p` не путал
# dev и prod-стек (они должны использовать РАЗНЫЕ контейнеры и volume-ы).
# До этой фиксации запуск `docker compose -f base.yml -f prod.yml` без `-p`
# из этого каталога перецеплял `sewing-db-1` на чужой volume и данные
# «терялись» — см. историю инцидента в чате.
name: sewing

include:
  - docker-compose.base.yml

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://user:${DB_PASSWORD}@db:5432/myapp
      APP_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # В dev по умолчанию выключено: схему обычно катают вручную через
      # `prisma migrate dev` / `db push`. Чтобы включить точечно, поставьте
      # PRISMA_AUTO_SYNC=1 в .env.dev.
      PRISMA_AUTO_SYNC: ${PRISMA_AUTO_SYNC:-0}
      PRISMA_AUTO_SYNC_RETRIES: ${PRISMA_AUTO_SYNC_RETRIES:-15}
      PRISMA_AUTO_SYNC_ACCEPT_DATA_LOSS: ${PRISMA_AUTO_SYNC_ACCEPT_DATA_LOSS:-0}
    depends_on:
      - db
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      INTERNAL_API_URL: http://api:3001/api
      API_URL: http://api:3001/api
    depends_on:
      - api
    networks:
      - app-network
