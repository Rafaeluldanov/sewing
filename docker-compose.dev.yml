# Имя проекта Compose жёстко зафиксировано, чтобы запуск без `-p` не путал
# dev и prod-стек (они должны использовать РАЗНЫЕ контейнеры и volume-ы).
# До этой фиксации запуск `docker compose -f base.yml -f prod.yml` без `-p`
# из этого каталога перецеплял `sewing-db-1` на чужой volume и данные
# «терялись» — см. историю инцидента в чате.
name: sewing

include:
  - docker-compose.base.yml

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      # Persistent uploads-том. Имя зашито (sewing_uploads), external=true
      # — Compose не создаёт и не удаляет volume сам. Перед первым
      # подъёмом dev-стека на новом сервере выполнить:
      #   docker volume create sewing_uploads
      - dev_uploads:/var/lib/sewing/uploads
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://user:${DB_PASSWORD}@db:5432/myapp
      # Мультитенантность (DB-per-tenant): БД реестра тенантов. Пусто ⇒
      # single-tenant fallback (control-plane выключен). Чтобы включить —
      # задайте CONTROL_PLANE_DATABASE_URL в .env.dev, напр.
      # postgresql://user:${DB_PASSWORD}@db:5432/control_plane и пересоздайте api.
      CONTROL_PLANE_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL:-}
      # Публичные URL dev-окружения. По умолчанию — https://dev.teeon.ru
      # (за nginx-сервисом prod-инсталляции). Локально без nginx переопределите
      # в .env.dev на http://localhost:3000.
      APP_URL: ${APP_URL:-https://dev.teeon.ru}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dev.teeon.ru}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://dev.teeon.ru/api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://dev.teeon.ru,http://localhost:3000,http://127.0.0.1:3000}
      # Корень файлового хранилища. Соответствует mount выше; в БД-URL-ах
      # лежит /uploads/..., которое Express и nginx раздают одинаково.
      PATTERNS_UPLOADS_DIR: /var/lib/sewing/uploads
      # В dev по умолчанию выключено: схему обычно катают вручную через
      # `prisma migrate dev` / `db push`. Чтобы включить точечно, поставьте
      # PRISMA_AUTO_SYNC=1 в .env.dev.
      PRISMA_AUTO_SYNC: ${PRISMA_AUTO_SYNC:-0}
      PRISMA_AUTO_SYNC_RETRIES: ${PRISMA_AUTO_SYNC_RETRIES:-15}
      PRISMA_AUTO_SYNC_ACCEPT_DATA_LOSS: ${PRISMA_AUTO_SYNC_ACCEPT_DATA_LOSS:-0}
      # Web Push (VAPID). Ключи берём из .env.dev. Без них push-модуль
      # стартует в disabled-режиме (подписки сохраняются, отправка молча
      # пропускается) — см. apps/api/src/modules/push/push.service.ts.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Модуль «Интеграции» (upgifts): ключ AES-256-GCM для шифрования
      # пароля сервисного аккаунта at-rest. Без него сохранение пароля
      # интеграции отклоняется (см. secret-box.ts). Задаётся в .env.dev.
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:-}
      # Ассистент (ИИ): платформенный ключ Anthropic. Пусто ⇒ ассистента
      # нельзя включить с источником ключа «платформенный» (компания
      # может задать свой ключ в настройках). См. docs/assistant.md.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - db
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      # NEXT_PUBLIC_* читается на client-side из window.__NEXT_DATA__,
      # на dev-сервере подхватывается без пересборки. Дефолт ставит
      # https://dev.teeon.ru/api — для работы через nginx; локально без
      # nginx достаточно переопределить в .env.dev.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dev.teeon.ru/api}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dev.teeon.ru}
      APP_URL: ${APP_URL:-https://dev.teeon.ru}
      # Базовый домен для авто-подстановки host в форме «Создать тенанта»
      # (/superadmin): host = <slug>.<этот домен>. На dev — dev.teeon.ru.
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-dev.teeon.ru}
      INTERNAL_API_URL: http://api:3001/api
      API_URL: http://api:3001/api
      # Стабильный ключ для Next.js Server Actions (см. .env.dev / .env.prod).
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      # Окно «Спросить» в админке. Флаг СЕРВЕРНЫЙ (не NEXT_PUBLIC_*):
      # читается в RSC, поэтому не зависит от момента сборки образа.
      FEATURE_AI_ASSISTANT: ${FEATURE_AI_ASSISTANT:-}
    depends_on:
      - api
    networks:
      - app-network

volumes:
  # См. комментарий у db_data: external + ручное создание тома.
  #   docker volume create sewing_uploads
  dev_uploads:
    external: true
    name: sewing_uploads
