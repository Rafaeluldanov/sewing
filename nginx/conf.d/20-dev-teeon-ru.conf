# -----------------------------------------------------------------------------
# 20-dev-teeon-ru.conf — заглушка для dev.teeon.ru (TLS-only).
#
# Контекст: сертификат для dev.teeon.ru уже выпущен (см. /etc/letsencrypt/
# live/dev.teeon.ru/), и мы НЕ хотим, чтобы случайный посетитель получал
# TLS-handshake fail / шёл на default vhost prod.teeon.ru.
#
# Почему просто 503, а не проксирование на dev-стек:
#   - dev-стек (sewing-web-1, sewing-api-1) собран с
#     `NEXT_PUBLIC_API_URL=http://localhost:3001/api` — этот URL зашит
#     в client-bundle и из браузера снаружи никуда не достучится;
#   - dev-БД содержит тестовые данные, открывать её наружу без согласования
#     политически неверно (и небезопасно).
#
# Когда понадобится реальный dev — отдельной задачей:
#   1) пересобрать sewing-web-1 с NEXT_PUBLIC_API_URL=https://dev.teeon.ru/api;
#   2) добавить external network sewing_app-network в этот compose;
#   3) заменить этот файл на честный прокси-конфиг по аналогии с 10-prod-*.
# -----------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.teeon.ru;

    ssl_certificate     /etc/letsencrypt/live/dev.teeon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.teeon.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;

    # ACME — продление сертификата для dev.teeon.ru (через тот же webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 503 "dev.teeon.ru: окружение не сконфигурировано публично. См. nginx/conf.d/20-dev-teeon-ru.conf.\n";
        add_header Content-Type text/plain always;
    }
}
