# -----------------------------------------------------------------------------
# 20-dev-teeon-ru.conf — vhost для https://dev.teeon.ru.
#
# Маршрутизация (longest-prefix nginx):
#   /api/      → sewing-api-1:3001  (dev NestJS)
#   /uploads/  → sewing-api-1:3001  (Express useStaticAssets, dev)
#   /          → sewing-web-1:3000  (Next.js dev-server, hot reload)
#
# Контейнеры из стека `docker-compose.dev.yml` (project=sewing). nginx
# подключён к их сети `sewing_app-network` через external-объявление в
# `docker-compose.prod.yml`. Подробнее про подключение и про то, почему
# именно container-name (а не короткое `web`/`api`) — см. nginx.conf.
#
# История: до этой правки vhost отдавал 503-заглушку, потому что dev-web
# был собран с `NEXT_PUBLIC_API_URL=http://localhost:3001/api`, и
# браузер снаружи не доходил до API. Теперь URL правильный
# (https://dev.teeon.ru/api), бандл собран с ним — поэтому открываем
# полный proxy.
# -----------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.teeon.ru;

    ssl_certificate     /etc/letsencrypt/live/dev.teeon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.teeon.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # На dev HSTS не включаем: окружение экспериментальное, можем гонять
    # без TLS внутрь, не хотим прибивать https в браузерах разработчиков.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ACME — продление сертификата для dev.teeon.ru через тот же webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # proxy_pass через переменную (а не upstream-блок) — чтобы резолв dev-хоста
    # откладывался до запроса (см. resolver в nginx.conf). Иначе погашенный
    # dev-стек уронил бы старт всего nginx и prod вместе с ним.
    location /api/ {
        set $dev_api sewing-api-1:3001;
        proxy_pass http://$dev_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $rid;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location ^~ /uploads/ {
        set $dev_api_uploads sewing-api-1:3001;
        proxy_pass http://$dev_api_uploads;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        access_log off;
    }

    location / {
        set $dev_web sewing-web-1:3000;
        proxy_pass http://$dev_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $rid;
        # WebSocket-апгрейды нужны Next.js dev-серверу (HMR через ws на /_next/webpack-hmr).
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
