# -----------------------------------------------------------------------------
# 11-expo-teeon-ru.conf — выставочный тенант `expo` на прод-стеке.
#
# Копия 10-prod-teeon-ru.conf с другим server_name и сертификатом: тот же
# api/web-upstream, тенанта API выбирает по Host (control-plane:
# Tenant.slug=expo → tenant_expo, TenantDomain=expo.teeon.ru). Данные цеха
# и выставки не пересекаются — разные БД. Cert: certbot webroot HTTP-01,
# продление подхватывает общий sewing-cert-renew.sh.
#
# Зачем отдельный тенант, а не боевой prod: показы на стенде плодят смены,
# начисления и заказы, а документ выпуска на prod читает ERP (upgifts).
# См. docs/mockups/sewing-shopfloor-steps.html и scripts/demo/expo-setup.mjs.
# -----------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name expo.teeon.ru;

    ssl_certificate     /etc/letsencrypt/live/expo.teeon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expo.teeon.ru/privkey.pem;

    # Mozilla Intermediate (актуально для LE ECDSA-сертификата). Если будете
    # ужесточать до Modern — выкиньте TLSv1.2 и оставьте только TLSv1.3.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS включаем умеренно (1 год, без preload) — preload требует обещания
    # никогда не уходить с https; не делаем без явного согласования.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Дублируем ACME здесь тоже на случай, если challenge придёт по https
    # (бывает у HTTP/2 ALPN-проб). Это безопасно, токены публичные.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ----- /api/ → NestJS ----------------------------------------------------
    # Долгие запросы (печать паспортов, выгрузки) могут идти десятки секунд —
    # не подрезаем агрессивно.
    location /api/ {
        proxy_pass http://prod_api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $rid;
        # Мультитенантность: x-tenant-host выбирает БД тенанта и его НЕЛЬЗЯ
        # принимать от клиента (иначе подделкой заголовка читается чужой
        # тенант). Затираем входящий — этот заголовок ставит только web-SSR,
        # который ходит в api напрямую (минуя nginx). Полное закрытие
        # (валидация Host по per-tenant server_name + tenant-claim в сессии) —
        # Фаза 3.
        proxy_set_header X-Tenant-Host     "";
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # ----- /uploads/ → NestJS static -----------------------------------------
    # Это статические файлы (превью лекал и т.п.). Не пишем в access.log
    # каждое превью, только ошибки — иначе лог быстро распухнет.
    location ^~ /uploads/ {
        proxy_pass http://prod_api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # См. /api/ — клиентский x-tenant-host не доверяем.
        proxy_set_header X-Tenant-Host     "";
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        access_log off;
    }

    # ----- Next.js -----------------------------------------------------------
    # Включаем websocket-хедеры на случай, если в будущем добавится Next.js
    # HMR / RSC streaming через WebSocket — конфиг готов.
    location / {
        proxy_pass http://prod_web_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $rid;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
