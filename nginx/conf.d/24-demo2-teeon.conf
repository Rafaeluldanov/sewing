# -----------------------------------------------------------------------------
# 24-demo2-teeon.conf — точный vhost для https://demo2.teeon.ru (тенант demo2)
# на НАСТОЯЩЕМ домене teeon.ru с доверенным Let's Encrypt cert (HTTP-01 через
# :80; demo2.teeon.ru резолвится wildcard-записью *.teeon.ru → этот сервер).
# Проксирует в dev-стек (demo2 — dev-тенант); тенант берётся по Host.
# Host-local dev-артефакт; на свежем хосте нужен cert до reload.
#
# Это ОБРАЗЕЦ per-subdomain HTTP-01 пути. Для zero-touch онбординга (без
# отдельного файла на тенанта) — либо wildcard-cert *.teeon.ru (DNS-01, токен
# Яндекса) + один wildcard-vhost, либо автоген этого блока в create-tenant.
#
# Продление: docker run --rm -v /etc/letsencrypt:/etc/letsencrypt \
#   -v /var/www/certbot:/var/www/certbot certbot/certbot renew && nginx -s reload
# -----------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo2.teeon.ru;

    ssl_certificate     /etc/letsencrypt/live/demo2.teeon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo2.teeon.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location /api/ {
        set $d2t_api sewing-api-1:3001;
        proxy_pass http://$d2t_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $rid;
        proxy_set_header X-Tenant-Host     "";
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location ^~ /uploads/ {
        set $d2t_api_uploads sewing-api-1:3001;
        proxy_pass http://$d2t_api_uploads;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Tenant-Host     "";
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        access_log off;
    }

    location / {
        set $d2t_web sewing-web-1:3000;
        proxy_pass http://$d2t_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $rid;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
