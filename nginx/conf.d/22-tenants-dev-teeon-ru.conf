# -----------------------------------------------------------------------------
# 22-tenants-dev-teeon-ru.conf — wildcard-vhost для тенантов: https://*.dev.teeon.ru
#
# Мультитенантность «как надо»: ОДИН vhost обслуживает ВСЕ поддомены-тенанты
# (client1.dev.teeon.ru, demo2.dev.teeon.ru, …) → тот же dev-стек
# (sewing-api-1 / sewing-web-1). Тенант определяется ПО Host: control-plane
# (TenantDomain) → нужная БД. Новый клиент = строка в TenantDomain + его БД
# (create-tenant), БЕЗ правок nginx.
#
# Точный server_name `dev.teeon.ru` (20-dev-teeon-ru.conf) имеет приоритет над
# wildcard — значит апекс остаётся дефолтным тенантом со своим настоящим
# сертификатом, а сюда попадают только поддомены.
#
# DNS: нужен wildcard `*.dev.teeon.ru → <IP сервера>` (одна запись на все
# тенанты). TLS: сейчас self-signed `*.dev.teeon.ru` (браузер предупредит) —
# для доверенного нужен wildcard-сертификат (Let's Encrypt DNS-01) или
# сертификат на конкретный поддомен.
#
# Неизвестный поддомен (нет в TenantDomain) → app вернёт 404 UNKNOWN_TENANT.
# -----------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # *.dev.teeon.ru — поддомены тенантов; *.<ip>.nip.io — публичный
    # wildcard-DNS для теста в браузере БЕЗ правок hosts (nip.io резолвит
    # любой <name>.159.194.208.32.nip.io в этот IP).
    server_name *.dev.teeon.ru *.159.194.208.32.nip.io;

    ssl_certificate     /etc/letsencrypt/live/wildcard.dev.teeon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard.dev.teeon.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /api/ {
        set $tnt_api sewing-api-1:3001;
        proxy_pass http://$tnt_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $rid;
        # Клиентский x-tenant-host не доверяем — тенант берётся из Host=$host.
        proxy_set_header X-Tenant-Host     "";
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location ^~ /uploads/ {
        set $tnt_api_uploads sewing-api-1:3001;
        proxy_pass http://$tnt_api_uploads;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Tenant-Host     "";
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        access_log off;
    }

    location / {
        set $tnt_web sewing-web-1:3000;
        proxy_pass http://$tnt_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $rid;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
