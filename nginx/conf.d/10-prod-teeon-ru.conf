# -----------------------------------------------------------------------------
# 10-prod-teeon-ru.conf — основной prod-вход.
#
# Что делает:
#   - Терминирует TLS для https://prod.teeon.ru с использованием LE-сертификата
#     из /etc/letsencrypt/live/prod.teeon.ru/.
#   - Маршрутизация (longest-prefix matching nginx, объявления — в правильном
#     порядке: /api/ и /uploads/ ДО общего /):
#       /api/      → api:3001  (NestJS, AuthGuard сам разрулит auth)
#       /uploads/  → api:3001  (Express useStaticAssets, см. apps/api/src/main.ts)
#       /          → web:3000  (Next.js standalone)
#
# Почему /api/ и /uploads/ напрямую на api, а не через web (Next.js rewrite):
#   - меньше hop-ов и меньше latency для тяжёлых файлов;
#   - rewrites() в next.config.js всё равно остаётся рабочим fallback'ом для
#     dev и для случая, когда кто-то ходит к web в обход nginx;
#   - совпадает с историческим nginx-снипетом из docs/deploy-stage.md
#     (там 127.0.0.1:3001 — у нас api:3001 через docker network, идея та же).
# -----------------------------------------------------------------------------

# Современные TLS-настройки. Вынесены в server-блок чтобы не трогать
# другие vhost-ы (на этом nginx сейчас один реальный домен).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prod.teeon.ru;

    ssl_certificate     /etc/letsencrypt/live/prod.teeon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prod.teeon.ru/privkey.pem;

    # Mozilla Intermediate (актуально для LE ECDSA-сертификата). Если будете
    # ужесточать до Modern — выкиньте TLSv1.2 и оставьте только TLSv1.3.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS включаем умеренно (1 год, без preload) — preload требует обещания
    # никогда не уходить с https; не делаем без явного согласования.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Дублируем ACME здесь тоже на случай, если challenge придёт по https
    # (бывает у HTTP/2 ALPN-проб). Это безопасно, токены публичные.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ----- /api/ → NestJS ----------------------------------------------------
    # Долгие запросы (печать паспортов, выгрузки) могут идти десятки секунд —
    # не подрезаем агрессивно.
    location /api/ {
        proxy_pass http://prod_api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $rid;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # ----- /uploads/ → NestJS static -----------------------------------------
    # Это статические файлы (превью лекал и т.п.). Не пишем в access.log
    # каждое превью, только ошибки — иначе лог быстро распухнет.
    location ^~ /uploads/ {
        proxy_pass http://prod_api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        access_log off;
    }

    # ----- Next.js -----------------------------------------------------------
    # Включаем websocket-хедеры на случай, если в будущем добавится Next.js
    # HMR / RSC streaming через WebSocket — конфиг готов.
    location / {
        proxy_pass http://prod_web_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $rid;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
