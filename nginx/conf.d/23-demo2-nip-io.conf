# -----------------------------------------------------------------------------
# 23-demo2-nip-io.conf — точный vhost для https://demo2.159.194.208.32.nip.io
# с ДОВЕРЕННЫМ сертификатом Let's Encrypt (HTTP-01 через :80, nip.io резолвится
# публично). Exact server_name выигрывает у wildcard *.159.194.208.32.nip.io
# из 22-tenants (там self-signed), поэтому именно demo2 открывается без
# предупреждения браузера. Проксирует в тот же dev-стек, тенант — по Host.
# Host-local dev-артефакт (как 22-tenants), НЕ закоммичен.
#
# Продление: docker run --rm -v /etc/letsencrypt:/etc/letsencrypt \
#   -v /var/www/certbot:/var/www/certbot certbot/certbot renew  (потом nginx -s reload)
# -----------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo2.159.194.208.32.nip.io;

    ssl_certificate     /etc/letsencrypt/live/demo2.159.194.208.32.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo2.159.194.208.32.nip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /api/ {
        set $d2_api sewing-api-1:3001;
        proxy_pass http://$d2_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $rid;
        proxy_set_header X-Tenant-Host     "";
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location ^~ /uploads/ {
        set $d2_api_uploads sewing-api-1:3001;
        proxy_pass http://$d2_api_uploads;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Tenant-Host     "";
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        access_log off;
    }

    location / {
        set $d2_web sewing-web-1:3000;
        proxy_pass http://$d2_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $rid;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
