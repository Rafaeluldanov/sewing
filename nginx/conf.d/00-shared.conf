# -----------------------------------------------------------------------------
# 00-shared.conf — общий :80 (HTTP) сервер для:
#   1. ACME HTTP-01 challenge (certbot --webroot записывает токены сюда).
#   2. Принудительный редирект всего остального трафика в HTTPS.
#
# По имени файла начинается на `00-` — nginx грузит conf.d/*.conf в
# алфавитном порядке, и default_server должен быть определён один раз.
# Этот блок ловит любой Host (default_server), включая случаи, когда кто-то
# обращается по IP сервера.
# -----------------------------------------------------------------------------

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Webroot для Let's Encrypt. Каталог монтируется из хоста /var/www/certbot
    # (см. docker-compose.prod.yml). certbot --webroot создаёт там
    # `.well-known/acme-challenge/<token>`, мы отдаём как plain text.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
        access_log /var/log/nginx/acme.log main_ext;
    }

    # Всё остальное — в HTTPS. host передаём как есть, чтобы dev/prod ушли
    # на свои же домены (если у пользователя dev.teeon.ru → 301 на https
    # того же dev.teeon.ru).
    location / {
        return 301 https://$host$request_uri;
    }
}
