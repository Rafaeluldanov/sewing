# -----------------------------------------------------------------------------
# nginx.conf — main config для reverse-proxy перед prod-стеком sewing.
#
# Что внутри:
#   - http-блок с базовыми настройками (gzip, sendfile, размеры буферов).
#   - keepalive-апстримы к web (Next.js) и api (NestJS), доступным по
#     docker-сети `sewing-prod_prod-network` под именами `web` / `api`.
#   - Подключение vhost-ов из ./conf.d/*.conf — там лежат server-блоки
#     (prod.teeon.ru, dev.teeon.ru-stub) и общий :80 ACME/redirect.
#
# Лог-формат пишет request_id (берётся из X-Request-ID, если клиент прислал;
# иначе nginx сгенерирует $request_id сам и добавит в проксированный запрос —
# полезно сматчить браузерный лог с api-логом по одному ID).
# -----------------------------------------------------------------------------

worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65s;
    types_hash_max_size 2048;
    server_tokens off;

    # Лимит на загрузку файлов (лекала/превью могут быть тяжёлыми, поэтому
    # 50m. Если поднимется выше — увеличить и согласовать с api-сервисом.).
    client_max_body_size 50m;

    # Buffering выключаем для api/uploads, чтобы не задерживать стриминг
    # ответов с бэкенда. Для web (Next.js) включён по умолчанию (быстрее).
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering on;

    # request id: либо берём из заголовка клиента, либо генерим — пробрасываем
    # дальше, чтобы api записал в свой лог тот же ID.
    map $http_x_request_id $rid {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format main_ext
        '$remote_addr - $remote_user [$time_iso8601] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rid=$rid host=$host upstream=$upstream_addr ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main_ext;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/javascript application/json application/xml
        text/css text/plain text/xml image/svg+xml font/ttf font/otf;

    upstream web_upstream {
        # Next.js standalone server в контейнере sewing-prod-web-1.
        server web:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream api_upstream {
        # NestJS в контейнере sewing-prod-api-1. Сюда же ходят /api/ и /uploads/.
        server api:3001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Общие proxy-заголовки для всех vhost-ов: Host пробрасываем как есть
    # (важно для CORS / cookie domain), X-Forwarded-Proto = https, чтобы
    # backend знал реальную схему даже через TLS-терминатор.
    include /etc/nginx/conf.d/*.conf;
}
