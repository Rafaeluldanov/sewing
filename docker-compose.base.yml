services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  # Том с данными Postgres. external=true → Compose НЕ создаёт и НЕ удаляет
  # его сам: даже `docker compose down -v` не снесёт БД. Если разворачиваете
  # окружение с нуля — заранее создайте том вручную:
  #   docker volume create sewing_db_data        # для dev (project=sewing)
  db_data:
    external: true
    name: sewing_db_data

networks:
  app-network:
    driver: bridge
